name: Release portable Windows EXE

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and upload the portable EXE for'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: true

jobs:
  build-and-upload-portable-exe:
    name: Build and upload portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Release events check out the tagged release; manual dispatches build
          # the branch they are dispatched from (e.g. to retry a failed build
          # without re-publishing the release).
          ref: ${{ github.event.release.tag_name || '' }}

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Install 7-Zip (CLI)
        run: choco install 7zip -y

      - name: Build portable EXE with Maven
        run: mvn -pl :cli -am -P windows-portable,!windows-exe package

      - name: Verify artifact exists
        shell: pwsh
        run: |
          $artifact = Get-ChildItem -Path "cli/target/portable/officestamper-portable-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $artifact) { Write-Error "Portable EXE was not produced." }
          Write-Host "Found artifact: $($artifact.FullName)"

      - name: Rename artifact for the release tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          # A manual retry builds the default branch, so the produced file carries
          # the current snapshot version; name it after the target release instead.
          $version = "${{ inputs.tag_name }}" -replace '^v', ''
          $src = Get-ChildItem "cli/target/portable/officestamper-portable-*.exe" | Select-Object -First 1
          $dest = "cli/target/portable/officestamper-portable-$version.exe"
          Move-Item $src.FullName $dest
          Write-Host "Renamed artifact to $dest"

      - name: Upload portable EXE to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
          files: |
            cli/target/portable/officestamper-portable-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
